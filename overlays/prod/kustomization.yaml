apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-service-prod
resources:
  - ../../base
  - rollout.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: product-service
      $patch: delete
images:
  - name: product-service
    newTag: "v1"